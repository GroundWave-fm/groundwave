name: GroundWave CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    name: Build, Test Coverage & Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: groundwave_user
          POSTGRES_PASSWORD: groundwave_password
          POSTGRES_DB: groundwave_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://groundwave_user:groundwave_password@localhost:5432/groundwave_dev
      JWT_SECRET: ci_test_jwt_secret_groundwave_2026

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate

      - name: Verify pnpm Version
        run: pnpm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate & Seed Database
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Run Monorepo Build
        run: pnpm build

      - name: Run Typecheck & Lint
        run: pnpm lint

      - name: Run Test Coverage Gate
        run: pnpm test:coverage
