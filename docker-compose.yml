version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: groundwave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: groundwave_user
      POSTGRES_PASSWORD: groundwave_password
      POSTGRES_DB: groundwave_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundwave_user -d groundwave_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: groundwave-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
